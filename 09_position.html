<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box-01{
            height: 300px;
            background-color: tan;
            margin-top: 200px;
            position: relative;
        }
        .box-01 p{
            background-color: rgb(211, 247, 198);
            width: 200px;
            height: 200px;
            position:absolute;
            top: 0;
            left: 100px;
        }
        .box{
            width: 500px;
            height: 500px;
            background-color: mistyrose;
            margin: 150px auto;
            position: relative;
        }

        .box p{
            width: 100px;
            height: 100px;
            position: absolute;
            top: 100px;
            left: 100px;
        }
        .box p:nth-child(1) {
            background-color: red;
        }
        .box p:nth-child(2) {
            background-color: rgb(187, 244, 117);
            left: 0;
            top: -100px;
        }
        .box p:nth-child(3) {
            background-color: rgb(246, 190, 85);
            left: 400px;
            top: 400px;
        }
        .box p:nth-child(4) {
            background-color: rgb(185, 214, 210);
            left: 0;
            top:500px;
        }
        .box p:nth-child(5) {
            background-color: rgb(230, 193, 124);
            position: fixed;
            right: 50px;
            bottom: 50px;
        }
        .box p:nth-child(6) {
            background-color: rgb(221, 80, 234);
            position: sticky;
            top: 30px;
            color: #fff;
        }
        body{
            height: 3000px;
        }
    </style>
</head>
<body>
    <div class="box-01">
        <p>absolute</p>
    </div><!-- box-01 -->

    <div class="box">
        <p>1</p>
        <p>2</p>
        <p>3</p>
        <p>4</p>
        <p>5</p>
        <p>6</p>
    </div>
</body>
</html>
