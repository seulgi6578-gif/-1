<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가로배치</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        .menu{
            display: flex; 
            /* 자식 요소 가로 배치 */
            gap: 12px; /* 간격 display:flex가 있을 때만 활용가능*/

        }
        .menu li{
            padding:0 20px;
            list-style: none;
            height: 50px;
            border: solid 1px black;
            border-radius: 20px;
            line-height: 47px;
            /* margin-right: 12px; */
        }
        .list .item {
            width: 432px;
            list-style: none;
        }
        .list .item img {
            width: 430px;
            height: 500px;
            line-height: 47px;
        }
        .list{
            display: flex;
            gap:32px;
        }
        .list .item p {
            background-color: ;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            background-color: blanchedalmond;
        }
    </style>
</head>
<body>
    <ul class="menu">
        <li>menu 1</li>
        <li>menu 2</li>
        <li>menu 3</li>
        <li>menu 4</li>
        <li>menu 5</li>
    </ul><!-- menu -->

    <div class="list">
        <div class="item">
            <img src="img/alexander-lunyov-F5ayUiHlSLQ-unsplash.jpg"
            <p>아이템 1</p>
        </div><!-- item -->
        <div class="item">
            <img src="img/benjamin-cheng-zrF9DkbjmyU-unsplash.jpg"
            <p>아이템 2</p>
        </div><!-- item -->
        <div class="item">
            <img src="img/sebastian-schuster--XGCaZsdROg-unsplash.jpg"
            <p>아이템 3</p>
        </div><!-- item -->
    </div><!-- list -->
</body>
</html>
