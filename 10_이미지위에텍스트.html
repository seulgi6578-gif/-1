<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=!, initial-scale=1.0">
    <title>이미지위에텍스트</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
    }
    .box{
        width: 400px;
        height: 400px;
    }
    .box img{
        width: 100%;
        height: 100%;
    }
    .box p{
        position: absolute;
        right: 290px;
        top: 0px;
        color: #fff;
    }

    .list {
        width: 1280px;
        margin: 100px auto;
        display: flex;
        justify-content: space-between;
    }
    .list .item{
        width: 400px;
        height: 400px;
        position: relative;
        border-radius: 40px;
        overflow: hidden; /* 벗어난 자식 숨김 */
    }

    .list .item img{
        width: 100%;
        height: 100%;
    }
    .list .item p{
        background-color: aliceblue;
        width: 50px;
        position: absolute;
        left: 0;
        bottom: 0;
        background-color: rgba(247, 220, 220, 0.724);
        width: 100%;
        padding: 16px;
        box-sizing: border-box;
        backdrop-filter: blur(10px);
    }

</style>
<body>
    <div class="box">
        <img src="img/benjamin-cheng-zrF9DkbjmyU-unsplash.jpg">
        <p>이벤트</p>
    </div><!-- box -->
    
    <div class="list">
        <div class="item">
            <img src="img/sebastian-schuster--XGCaZsdROg-unsplash.jpg">
            <p>item 1</p>
        </div>
        <div class="item">
            <img src="img/sebastian-schuster--XGCaZsdROg-unsplash.jpg">
            <p>item 2</p>
        </div>
        <div class="item">
            <img src="img/sebastian-schuster--XGCaZsdROg-unsplash.jpg">
            <p>item 3</p>
        </div><!-- .item -->

    </div><!-- .list -->
</body>
</html>
