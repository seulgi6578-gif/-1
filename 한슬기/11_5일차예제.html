<!DOCTYPE html>
<html lang="KO">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11일차예제</title>
</head>
<style>
    .* {
        margin: 0;
        padding: 0;
    }

    .section {
        width: 1360px;
        margin: 0 auto;
    }
    .section .text{
        margin-bottom: 60px;
        text-align: center;
    }
    .section .text .title h1{
        font-size: 40px;
        margin-bottom: 18px;
    }
    .section .text .title p{
        font-size: 18px;
        margin-bottom: 36px;
    }
    .section .text a{
        font-size: 18px;
        margin-bottom: 60px;
        text-decoration: none;
        color: black;
        width: 201px;
        height: 48px;
        border: solid 1px #000;
        display:block;
        margin: 0 auto;
        border-radius: 30px;
        line-height: 48px;
    }
    .section .list{
        display:flex;
        justify-content: space-between;/* 가운데 간격 */
    }

    .section .list .item{
        width: 432px; 
        position: relative;
    }
    .section .list .item img{
        width: 100%;
        height: 560px;
        display: block; /* 밑에바닥에 붙이기 */
    }
    .section .list .item p{
        font-size: 28px;
        font-weight: bold;
        text-align: center;
        position: absolute;
        left: 0;
        bottom: 0;
        color: rgba(235, 235, 235, 0.419);
        padding: 10px;
        text-align: center;
    

    }




</style>

<body>
    <div class="section">
        <div class="text">
            <div class="title">
                <h1>시노텍스 공식몰</h1>
                <p>필터기술로 건강한 삶에 기여하는 "라이프 사이언스 필터(Life Science Filter)'<br>
                    시노펙스의 반도체 필터 기술력 이제 일상생활에서 직접 경험해보세요.</p>
            </div><!-- .tittle -->
            <a href="#">공식몰바로가기</a>
        </div><!-- .text -->

        <div class="list">
            <div class="item">
                <img src="img/alexander-lunyov-F5ayUiHlSLQ-unsplash.jpg">
                <p>앱솔루트 샤워기필터</p>
            </div>
            <div class="item">
                <img src="img/benjamin-cheng-zrF9DkbjmyU-unsplash.jpg">
                <p>프리미엄라이트 마스크</p>
            </div>
            <div class="item">
                <img src="img/sebastian-schuster--XGCaZsdROg-unsplash.jpg">
                <p>퓨어워터 여행키트</p>
            </div>
        </div>

    </div><!-- section -->

</body>

</html>
