<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4일차 예제</title>
    <style>
        
        *{
            margin: 0;
            padding: 0;
            
        }
        .box{
            background-color: rgb(184, 236, 236);
            padding: 60px 150px;
            width: 700px;
            box-sizing: border-box;
            text-align: center;
            display: block;
            margin: auto;
            }
        
            .box a{ 
            text-decoration: none;
            font-size: 16px;
            display: block;
            border: solid 1px rgb(0, 0, 0);
            margin: 0px auto;
            width: 250px;
            height: 50px;
            border-radius: 300px; /* 곡선주기 */
            line-height: 47px;

        }
        .box h1{
            font-size: 80px;
            margin-bottom: 53px;
            text-align: center;
        }
        .box .date p {
            text-align: center;
            font-size: 24px;
        }
        .box div{
            margin-bottom: 53px;
        }
        .step div{
            margin-bottom: 30px;
            text-align: center;
            font-size: 16px;
        }

        .box .step{
            margin-bottom: 53px;
        }

        .box .step div{
            border-bottom: solid 1px black;
        }
        .box .step div p:nth-child(1) {
            font-weight: bold;
        }
        .box .step div p:nth-child(2) {
            padding-bottom: 24px;
        }
        
    </style>
</head>
<body>
    <div class="box">
        <h1>EVENT</h1>
        <div class="date">
            <p>팔로우 이벤트</p>
            <p>2026.01.26~2026.02.28</p>
        </div><!-- date -->
        <div class="step">
            <div>
                <p>step1</p>
                <p>본 계정을 팔로우하세요!</p>
            </div>
            <div>
                <p>step2</p>
                <p>이 게시글을"좋아요"눌러주세요!</p>
            </div>
            <div>
                <p>step3</p>
                <p>댓글로 '아이디!'남겨주세요!</p>
            </div>
            <div>
                <p>step4</p>
                <p>참여자 모두에게 할인쿠폰 증정</p>
        </div><!-- step -->
           <a href="#">계정으로 이동하기</a>
    </div> <!--box-->
        
</body>
</html>
