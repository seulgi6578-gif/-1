<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테두리</title>
    <style>
        *{
            margin :0;
            padding: 0;
        }
        ul li{
            background-color: rgb(15, 179, 124);
            width: 150px;
            height: 50px;
            margin: 20px;
            list-style: none;
            box-sizing: border-box;
            /* 테두리,패딩 포함하여 사이즈 설정 */
        }
        ul .border-01{
            border-top: solid 5px yellow;
        }
        ul .border-02{
            border-right: dotted 3.5px wheat;
            /* border-top
            border-right
            border-bottom
            border-left */
        }
        ul .border-03{
            border: dashed 3px tomato;
        }
    </style>
</head>
<body>
    <ul>
        <li class="border-01">테두리1</li>
        <li class="border-02">테두리2</li>
        <li class="border-03">테두리3</li>
    </ul>
</body>
</html>
